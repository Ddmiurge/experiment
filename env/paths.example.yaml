# 路径模板 —— 复制成 env/paths.yaml 后按机器修改。
# paths.yaml 不进 git（每台机器不同）。
#
# Mac 上只有 results/ 和 third_party/ 有意义；
# 模型、数据、runtime 三项只有服务器需要填。

models:
  llava_1_5_7b:     /root/models/llava-v1.5-7b
  judge_qwen3_8b:   /root/models/Qwen3-8B
  # 以下两个已弃用，保留仅为对照：
  #   llama_guard_3_8b —— T0.3 验过，但原文没用它（原文 MM-SafetyBench 用 GPT-4o-mini）
  #   gpt4o_mini       —— 原文判官，需要 OpenAI API，服务器境内直连不通

# ASR 判官（T1.3）
judge:
  model: judge_qwen3_8b
  # 若服务器上的 vLLM 服务可直接用，填它的 OpenAI 兼容端点；否则留空走本地权重
  endpoint: ""
  decode: greedy        # temperature=0
  seed: 42              # 与原文一致
  protocol: mm_safetybench_3class   # Safe / Unsafe / Refusal
  # ⚠ 与原文的偏离：裁判换了（Qwen3-8B 替代 GPT-4o-mini），判的问题相同。
  #   T1.3 须人工标 100 条做校准，偏差写进交付物 1。

data:
  mm_safetybench:   /root/data/MM-SafetyBench
  figstep:          /root/data/FigStep
  jailbreakv_28k:   /root/data/JailBreakV-28K
  mmbench:          /root/data/MMBench
  mm_vet:           /root/data/MM-Vet

# 由 env/fetch_third_party.sh 拉取，相对仓库根
third_party: ./third_party

# 结果落盘，相对仓库根
results: ./results

runtime:
  # 必须 eager。FlashAttention-2 不返回注意力权重，且不报错，只给 None。
  attn_implementation: eager
  device: cuda:0
  dtype: float16
